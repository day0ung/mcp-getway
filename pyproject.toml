[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-gateway"
version = "0.1.0"
description = "Jira / Confluence / GitLab REST API 기반 경량 MCP 게이트웨이"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "click>=8.0.0",
    "python-dotenv",
]

[project.scripts]
mcp-gateway = "mcp_gateway:main"

[tool.setuptools.packages.find]
where = ["src"]
